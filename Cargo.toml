[package]
name = "obunlock"
version = "0.1.0"
edition = "2024"
description = "Windows file-unlocking engine: find who locks a file, close handles / end processes, force delete, delete on reboot"
license = "MIT"
publish = false

[dependencies]
log = "0.4"
# Pinned to the same version as the host apps, so windows isn't compiled twice
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
